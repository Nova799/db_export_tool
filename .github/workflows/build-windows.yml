name: Build Windows executable

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --add-data "db_tool;db_tool" --add-data "logo.png;." --name "DBExportTool" app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DBExportTool-Windows
          path: dist/DBExportTool.exe
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "DB Export Tool v${{ github.run_number }}"
          body: "Build automatique depuis le commit ${{ github.sha }}."
          files: dist/DBExportTool.exe
EOF
echo "workflow updated"